name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -destination "platform=macOS" \
            -derivedDataPath build/ci \
            -only-testing:MaccyTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build release
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/ci-release \
            CODE_SIGNING_ALLOWED=NO \
            build
